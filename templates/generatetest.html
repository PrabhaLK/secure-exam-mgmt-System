{% extends 'professor_dashboard.html' %}
{% block body %}
<div class="row align-items-center d-flex justify-content-center">
  <div class="col-12 mb-4">
    <div class="card border-light shadow-sm components-section align-items-center d-flex justify-content-center">
      <div class="card-body align-items-center d-flex justify-content-center">
        <div class="row mb-4 justify-content-center">
                    <div class="col-12 text-center">
                      <h3 class="h3">GENERATE QUESTIONS & ANSWERS</h3>  
                    </div>
                    <div class="col-12 text-center mb-4">
                      <lottie-player src="https://assets3.lottiefiles.com/packages/lf20_6CrYF1.json"  background="transparent"  speed="1"  style="width: 400px; height: 300px;"  loop  autoplay></lottie-player>
                    </div>
                    <form method="POST" action="test_generate" class="mt-4 w-100">
                        <div class="form-group">
                            <label class="h6" for="inputText">Input Text</label>
                            <textarea id="inputText" name="itext" class="form-control" placeholder="Input Text?" rows="6" required></textarea>
                        </div>
                        <div class="form-group">
                            <label class="my-1 mr-2" for="inlineFormCustomSelectPref">Choose Question Type</label>
                            <select class="custom-select my-1 mr-sm-2" id="inlineFormCustomSelectPref" name="test_type" required>
                                <option value="objective">Objective</option>
                                <option value="subjective">Subjective</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="h6" for="noq">No of Questions</label>
                            <input type="number" id="noq" name="noq" class="form-control" placeholder="No. of Questions" min="1" required>
                        </div>
                        <input type="submit" class="btn btn-primary btn-block" value="Generate">
                    </form>
</div>
</div>
</div>
    </div>
</div>
{% endblock %}
