{% extends 'professor_dashboard.html' %}
{% block body %}
<div class="row align-items-center d-flex justify-content-center">
    <div class="col-12 mb-4">
        <div class="card border-light shadow-sm components-section align-items-center d-flex justify-content-center">
            <div class="card-body align-items-center d-flex justify-content-center">
                <div class="row mb-4 justify-content-center">
                    {% if cresults is not none %}
                    <div class="col-12 text-center">
                      <h3 class="h3">VIEW STUDENT LOGS</h3>  
                    </div>
                    <div class="col-12 text-center mb-4">
                      <lottie-player src="https://assets3.lottiefiles.com/packages/lf20_45rapv.json"  background="transparent"  speed="1"  style="width: 250px; height: 250px;"  loop  autoplay></lottie-player>
                    </div>
                                        <form action="displaystudentsdetails" method="POST" class="mt-4 w-100">
                                                <div class="form-group">
                                                        <label class="my-1 mr-2" for="livebox">Choose Exam ID:</label>
                                                        <select class="custom-select my-1 mr-sm-2" id="livebox" name="choosetid" required>
                                                                {% for test in cresults %}
                                                                <option value={{test['test_id']}}>{{test['test_id']}}</option>
                                                                {% endfor %}
                                                        </select>
                                                </div>
                                                <button type="submit" class="btn btn-primary btn-block">View Student Logs</button>
                                        </form>
                                
                            </div>
                            {% else %}
                            <div class="col-12 text-center">
                                <div class="mb-4"><lottie-player src="https://assets7.lottiefiles.com/datafiles/vhvOcuUkH41HdrL/data.json"  background="transparent"  speed="1"  style="width: 300px; height: 300px;"  loop  autoplay></lottie-player></div>
                                <h3 class="h3">
                                    No Records Found!
                                </h3>  
                              </div>
                            {% endif %}
                        </div>
        </div>
    </div>
</div>
{% endblock %}
